name: JARVIS Pro integration validation
on:
  push:
    branches: [work/jarvis-sop-api-20261014]
    paths:
      - 'backend/jarvis_integration.py'
      - 'backend/tests/test_jarvis_integration.py'
      - 'backend/server.py'
      - '.github/workflows/jarvis-integration.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: python -m pytest -q backend/tests/test_jarvis_integration.py
