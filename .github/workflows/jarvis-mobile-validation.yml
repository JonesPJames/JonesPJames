name: JARVIS mobile validation
on:
  push:
    branches: [work/jarvis-sop-api-20261014]
    paths: ['frontend/**', '.github/workflows/jarvis-mobile-validation.yml']
  pull_request:
    branches: [main, work/jarvis-sop-api-20261014]
    paths: ['frontend/**', '.github/workflows/jarvis-mobile-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npx expo install --check
