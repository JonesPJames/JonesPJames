name: JARVIS mobile TypeScript validation
on:
  push:
    branches: [work/jarvis-sop-api-20261014]
    paths:
      - 'frontend/app/jarvis.tsx'
      - 'frontend/app/home.tsx'
      - 'frontend/src/api.ts'
      - 'frontend/src/auth.tsx'
      - 'frontend/tsconfig.json'
      - 'frontend/eas.json'
      - '.github/workflows/jarvis-mobile-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate new JARVIS screen with TypeScript 6 compatible compiler
        run: npx --yes -p typescript@6.0.2 tsc --noEmit
