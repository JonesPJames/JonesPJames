name: JARVIS internal Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - work/jarvis-sop-api-20261014
    paths:
      - '.github/workflows/jarvis-preview-apk.yml'
      - 'frontend/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Verify Expo access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret. Configure Expo access before running preview build."
            exit 1
          fi
      - name: Build internal Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
