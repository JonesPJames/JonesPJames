name: JARVIS Android debug APK (GitHub)
on:
  push:
    branches: [work/jarvis-sop-api-20261014]
    paths: ['.github/workflows/jarvis-android-debug.yml']
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME" || { echo 'Android SDK not found'; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Generate Android project
        env:
          EXPO_PUBLIC_JARVIS_API_URL: https://jarvis-api-staging-staging.up.railway.app
          EXPO_PUBLIC_PRO_API_URL: https://remeslnik-pro-sop-staging-staging.up.railway.app
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Compile installable debug APK
        env:
          EXPO_PUBLIC_JARVIS_API_URL: https://jarvis-api-staging-staging.up.railway.app
          EXPO_PUBLIC_PRO_API_URL: https://remeslnik-pro-sop-staging-staging.up.railway.app
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: remeslnik-pro-jarvis-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
