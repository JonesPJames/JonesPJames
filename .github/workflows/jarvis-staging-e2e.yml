name: JARVIS live staging E2E
on:
  push:
    branches: [work/jarvis-sop-api-20261014]
    paths:
      - 'backend/tests/staging_e2e.py'
      - '.github/workflows/jarvis-staging-e2e.yml'
  workflow_dispatch:
jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_PRO_URL: https://remeslnik-pro-sop-staging-staging.up.railway.app
      STAGING_JARVIS_URL: https://jarvis-api-staging-staging.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Live integration and authorization checks
        run: python backend/tests/staging_e2e.py
