# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest uvicorn motor pydantic email-validator bcrypt pyjwt reportlab requests dotenv
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Start Backend Service
      env:
        MONGO_URL: "mongodb://localhost:27017"
        DB_NAME: "remeslnik_test"
        JWT_SECRET: "test_secret_key_12345"
        EMERGENT_LLM_KEY: "mock_key"
      run: |
        cd backend
        python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &
        BACKEND_PID=$!
        echo "Backend PID: $BACKEND_PID"    
        
        # Kontrola, zda port 8001 začal naslouchat (přes síťový nástroj nc)
        for i in {1..30}; do
          if nc -z 127.0.0.1 8001; then
            echo "Uvicorn port 8001 je aktivní a naslouchá!"
            break
          fi
          echo "Čekám na otevření portu backendu... ($i/30)"
          sleep 1
        done

    - name: Test with pytest
      env:
        MONGO_URL: "mongodb://localhost:27017"
        DB_NAME: "remeslnik_test"
        JWT_SECRET: "test_secret_key_12345"
        EMERGENT_LLM_KEY: "mock_key"
      run: |
        cd backend
        pytest