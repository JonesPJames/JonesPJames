name: JARVIS SOP API validation
on:
  push:
    branches: [work/jarvis-sop-api-20261014]
  pull_request:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m py_compile backend/jarvis_sop.py backend/server.py
      - name: Contract tests
        run: |
          python -m pip install pytest
          python -m pytest -q backend/tests/test_jarvis_sop_contract.py
